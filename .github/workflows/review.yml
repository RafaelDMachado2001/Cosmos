name: Revisão

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  revisao:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      # Sem o segredo, o job passa sem revisar: o repositorio funciona antes de
      # alguem decidir liga-lo. Ver README, secao CI.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY nao configurada; revisao pulada."
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: env.ANTHROPIC_API_KEY != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Revise este PR contra o CLAUDE.md da raiz e a spec em docs/superpowers/specs/.
            Comente só defeitos reais — correção, regressão, regra do projeto violada —
            com arquivo e linha. Sem elogios e sem estilo que o lint já cobre.
