name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:env
      # typecheck, lint e a suite inteira, incluindo a Shell em jsdom.
      - run: npm run check
      # O postbuild roda o prerender; sem VITE_API_URL, contra o acervo semente.
      - run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        # A versão do Neon em produção. O compose local segue no 16 até
        # alguém migrar o volume (pg_dump + restore): o diretório de dados
        # de uma versão não abre na outra.
        image: postgres:18-alpine
        env:
          # Termina em _test: tests/TestCase.php recusa qualquer outro banco.
          POSTGRES_DB: rdm_labs_test
          POSTGRES_USER: rdm
          POSTGRES_PASSWORD: ci-test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rdm -d rdm_labs_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: rdm_labs_test
      DB_USERNAME: rdm
      DB_PASSWORD: ci-test
      # DraftBlocksCli chama "node dist-ssr/draft-blocks-cli.js" com este cwd;
      # em produção é /srv/render (ver docker/php/Dockerfile), aqui é a raiz
      # do checkout, onde o passo "Node (dist-ssr do RDM Studio)" abaixo builda.
      RENDER_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Node (dist-ssr do RDM Studio)
        working-directory: .
        # Só o bundle de SSR, sem rodar o prerender (postbuild) — os testes do
        # backend só precisam de dist-ssr/draft-blocks-cli.js existir.
        run: |
          npm ci --no-audit --no-fund
          npx vite build --config vite.prerender.config.ts
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # gd e exif: o que spatie/image pede para o upload de mídia do RDM
          # Studio (redimensionar e gravar WebP).
          extensions: pdo_pgsql, intl, zip, gd, exif
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      # Nivel 8, sem baseline.
      - run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      # Fronteiras entre os módulos (deptrac.yaml).
      - run: ./vendor/bin/deptrac analyse --no-progress
      - run: php artisan test
      # De novo como em produção: o pooler do Neon pede prepared statements
      # emulados (config/database.php), e eles mudam como os parâmetros viajam.
      - run: php artisan test
        env:
          DB_EMULATE_PREPARES: 'true'

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # O build servido pelo Nginx de verdade: 404 com status real e pagina sem
      # JavaScript so existem la. VITE_API_URL vazia faz a constelacao ler o
      # acervo semente; o caminho com a API e do job de integracao.
      - run: docker compose build --build-arg VITE_API_URL= web
      - run: docker compose up -d web
      - name: Esperar o Nginx
        run: |
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://localhost:8080/pt && exit 0
            sleep 2
          done
          docker compose logs web
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  infra:
    name: infra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    # Sem credencial nenhuma: formato e schema dos provedores, não um plan.
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  producao:
    name: imagem de produção
    runs-on: ubuntu-latest
    # A imagem que vai para o Cloud Run, contra um Postgres de verdade: sobe só
    # com a configuração de produção completa, e responde em cada host o que
    # é dele.
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/production/Dockerfile -t rdm-production .
      - name: Postgres
        run: |
          docker network create prod
          docker run -d --name db --network prod -e POSTGRES_DB=rdm -e POSTGRES_USER=rdm -e POSTGRES_PASSWORD=ci-test postgres:18-alpine
          for _ in $(seq 1 30); do docker exec db pg_isready -U rdm -d rdm && exit 0; sleep 2; done
          exit 1
      - name: Ambiente de produção com valores de teste
        run: |
          cat > prod.env <<EOF
          APP_KEY=base64:$(openssl rand -base64 32)
          APP_URL=https://admin.rdmlabs.test
          DB_CONNECTION=pgsql
          DB_HOST=db
          DB_DATABASE=rdm
          DB_USERNAME=rdm
          DB_PASSWORD=ci-test
          SESSION_DRIVER=database
          CACHE_STORE=database
          SESSION_SECURE_COOKIE=true
          SESSION_DOMAIN=.rdmlabs.test
          MEDIA_DISK=s3
          MEDIA_S3_BUCKET=ci
          MEDIA_S3_ENDPOINT=https://ci.r2.cloudflarestorage.com
          MEDIA_URL=https://media.rdmlabs.test
          SITE_REBUILD_DRIVER=vercel
          VERCEL_DEPLOY_HOOK_URL=https://api.vercel.com/v1/integrations/deploy/ci
          SCHEDULER_OIDC_AUDIENCE=https://api.rdmlabs.test/api/internal/tick
          SCHEDULER_SERVICE_ACCOUNT=scheduler@ci.iam.gserviceaccount.com
          ADMIN_HOST=admin.rdmlabs.test
          API_HOST=api.rdmlabs.test
          EDGE_SHARED_SECRET=ci-edge
          SITE_URL=https://cosmos.rdmlabs.test
          EOF
          sed -i 's/^ *//' prod.env
      - name: Configuração incompleta não sobe
        run: |
          ! docker run --rm --network prod -e APP_KEY=base64:$(openssl rand -base64 32) rdm-production php artisan about
      - run: docker run --rm --network prod --env-file prod.env rdm-production php artisan migrate --force
      - name: Cada host responde o que é dele
        run: |
          docker run -d --name app --network prod -p 8080:8080 --env-file prod.env rdm-production
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://localhost:8080/up && break; sleep 2; done
          # Como o Worker entrega: o host original em X-Forwarded-Host, com o segredo.
          code() { curl -s -o /dev/null -w '%{http_code}' -H "X-Forwarded-Host: $1" -H 'X-Edge-Secret: ci-edge' "http://localhost:8080$2"; }
          # Sem o segredo, nem a API responde.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/publications)" = 404 ]
          [ "$(code api.rdmlabs.test /api/publications)" = 200 ]
          [ "$(code admin.rdmlabs.test /admin/login)" = 200 ]
          [ "$(code api.rdmlabs.test /admin/login)" = 404 ]
          [ "$(code admin.rdmlabs.test /api/publications)" = 404 ]
          [ "$(code admin.rdmlabs.test /admin/rdm-studio/admin.js)" = 200 ]
          ! curl -sI -H 'X-Forwarded-Host: api.rdmlabs.test' -H 'X-Edge-Secret: ci-edge' http://localhost:8080/api/publications | grep -qi '^server:'
      - if: failure()
        run: docker logs app || true

  integracao:
    name: integração
    runs-on: ubuntu-latest
    # O job que prova a fase: publicar faz a URL responder 200 com o texto, sem
    # rebuild de imagem; apagar a devolve a 404.
    env:
      SLUG: ci-publicacao-viva
      TITLE: Publicacao viva no CI
    steps:
      - uses: actions/checkout@v4
      - name: Ambiente com valores de teste
        run: |
          # Valores de teste gerados aqui: nenhum segredo real entra no CI.
          echo "DOCKER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DOCKER_GID=$(id -g)" >> "$GITHUB_ENV"
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-test/; s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-admin-test/' .env
          cp backend/.env.example backend/.env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-test/' backend/.env
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: RDM Studio (bundle do painel)
        # `web` serve backend/public/ por bind mount (docker-compose.yml) — sem
        # este build, /admin/studio sobe mas admin.js/admin.css dão 404.
        run: |
          npm ci --no-audit --no-fund
          npm run build:admin
      - run: docker compose --profile backend build app queue web
      - run: docker compose --profile backend up -d db
      - run: docker compose --profile backend run --rm --no-deps app composer install --no-interaction --prefer-dist --no-progress
      - run: docker compose --profile backend run --rm --no-deps app php artisan key:generate --force
      # Migra antes de subir `queue`: o worker consulta a tabela `cache` (o
      # sinal de restart do Laravel) assim que sobe, e sem isto a migration
      # ainda não tinha rodado — "relation cache does not exist" na primeira
      # verificação, e o worker repete a mesma falha depois de cada job.
      - run: docker compose --profile backend run --rm --no-deps app php artisan migrate --seed --force
      - run: docker compose --profile backend up -d db app queue web
      - name: RDM Studio responde (casca exige login; os assets, não)
        run: |
          # Espera pelo PHP, não pelo Nginx: o admin.js é estático e responde antes
          # de o PHP-FPM aceitar conexão, e o /admin/studio dava 502 na corrida.
          for _ in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/admin/studio)" = 302 ] && break; sleep 2; done
          status_js="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/admin/rdm-studio/admin.js)"
          status_studio="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/admin/studio)"
          [ "$status_js" = 200 ] && [ "$status_studio" = 302 ]
          # O Livewire põe um hash no prefixo; o Nginx precisa encaminhá-lo ao PHP.
          livewire="$(curl -fs http://localhost:8080/admin/login | grep -o 'livewire-[0-9a-f]*/livewire[^"]*\.js[^"]*' | head -1)"
          [ -n "$livewire" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/$livewire")" = 200 ]
      - name: Publicar
        # O mesmo observer que o salvar do Filament dispara; o formulario em si
        # e coberto por AdminPanelTest na suite do backend.
        run: |
          docker compose --profile backend exec -T app php artisan tinker --execute="
          \$p = App\Modules\Content\Models\Publication::create(['slug' => '$SLUG', 'category' => 'artigo', 'published_at' => now(), 'featured' => false, 'status' => App\Modules\Content\Models\Publication::STATUS_PUBLISHED]);
          \$p->translations()->create(['locale' => 'pt', 'title' => '$TITLE', 'summary' => 'Resumo.', 'body' => 'Texto do CI.']);
          \$p->translations()->create(['locale' => 'en', 'title' => '$TITLE', 'summary' => 'Summary.', 'body' => 'CI text.']);
          "
      - name: A URL responde 200 com o texto, servida do disco
        run: |
          url="http://localhost:8080/pt/publicacoes/$SLUG"
          for _ in $(seq 1 60); do
            body="$(curl -fs "$url" || true)"
            # Sem noindex: e o arquivo que o job gravou, nao a casca do @app.
            if echo "$body" | grep -q "$TITLE" && ! echo "$body" | grep -q noindex; then
              echo "publicado: $url"
              exit 0
            fi
            sleep 5
          done
          docker compose --profile backend logs queue
          exit 1
      - name: Apagar devolve 404
        run: |
          docker compose --profile backend exec -T app php artisan tinker --execute="App\Modules\Content\Models\Publication::where('slug', '$SLUG')->first()->delete();"
          url="http://localhost:8080/pt/publicacoes/$SLUG"
          for _ in $(seq 1 60); do
            status="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            if [ "$status" = 404 ]; then
              echo "podado: $url"
              exit 0
            fi
            sleep 5
          done
          docker compose --profile backend logs queue
          exit 1
      - run: npx playwright install --with-deps chromium
      - name: RDM Studio de ponta a ponta (publicar -> ver -> despublicar; todos os blocos e imagem)
        # O login do painel é só por Google; e2e:admin-session grava a sessão
        # do admin direto no banco e imprime o cookie (recusa fora de local/testing).
        run: |
          export E2E_ADMIN_COOKIE="$(docker compose --profile backend exec -T app php artisan e2e:admin-session)"
          npx playwright test e2e/studio.spec.ts e2e/studio-content.spec.ts
        env:
          E2E_BASE_URL: http://localhost:8080
      - if: failure()
        run: docker compose --profile backend logs
