name: rdm-labs

services:
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    working_dir: /app
    command: >-
      sh -c "
        cmp -s package-lock.json node_modules/.install-stamp 2>/dev/null ||
          (npm ci --no-audit --no-fund && cp package-lock.json node_modules/.install-stamp) &&
        npm run dev
      "
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "${DEV_BIND:-127.0.0.1}:${VITE_PORT:-5174}:${VITE_PORT:-5174}"
    environment:
      - VITE_PORT=${VITE_PORT:-5174}
      - VITE_SITE_URL=${VITE_SITE_URL:-http://localhost:5174}
      - VITE_POLLING=${VITE_POLLING:-0}
    networks:
      - rdm-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"
    volumes:
      - ./backend/public:/var/www/public:ro
      - ./backend/storage/app/public:/var/www/storage/app/public:ro
      - site:/srv/site
    networks:
      - rdm-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    profiles: [backend]
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-rdm}
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-RDM Labs}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@rdmlabs.dev}
      - PRERENDER_INTERNAL_TOKEN=${PRERENDER_INTERNAL_TOKEN:-rdm-cosmos-prerender-7f3a9c2e}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - TZ=${TIMEZONE:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rdm-network
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    profiles: [backend]
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --timeout=180
    volumes:
      - ./backend:/var/www
      - site:/srv/site
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-rdm}
      - DB_PASSWORD=${DB_PASSWORD}
      - PRERENDER_API_URL=http://web
      - SITE_DIR=/srv/site
      - PRERENDER_INTERNAL_TOKEN=${PRERENDER_INTERNAL_TOKEN:-rdm-cosmos-prerender-7f3a9c2e}
      - TZ=${TIMEZONE:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rdm-network
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    profiles: [backend]
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-rdm}
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=${TIMEZONE:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rdm-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles: [backend]
    environment:
      - POSTGRES_DB=${DB_DATABASE:-rdm_labs}
      - POSTGRES_USER=${DB_USERNAME:-rdm}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGTZ=${TIMEZONE:-America/Sao_Paulo}
      - TZ=${TIMEZONE:-America/Sao_Paulo}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "${DEV_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rdm} -d ${DB_DATABASE:-rdm_labs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rdm-network
    restart: unless-stopped

volumes:
  node_modules:
  postgres:
  site:

networks:
  rdm-network:
    driver: bridge
