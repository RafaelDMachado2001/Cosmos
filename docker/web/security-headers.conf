# Cabeçalhos de segurança do site estático. Incluído em cada `location` que
# serve arquivo do disco, e não no `server`: o Nginx só herda `add_header` de
# cima quando a location não declara nenhum, e quase todas declaram o seu
# Cache-Control. As locations do PHP ficam de fora de propósito — o Laravel
# manda os dele (SecurityHeaders), e uma segunda CSP aqui, sem os scripts
# inline do Filament, quebraria o painel.
#
# CSP: tudo da mesma origem. `style-src 'unsafe-inline'` é o <style data-head>
# que o prerender embute e os `style=""` do React. `img-src` só a própria
# origem (a mídia do Studio fica em /storage/ aqui; em produção, no host de
# mídia, que o vercel.json acrescenta) e `data:`, do cursor em SVG. Imagem de
# outro site num artigo não carrega: sobe pelo Studio.
# O JSON-LD é bloco de dados, não script executável: a CSP não o alcança.
#
# HSTS fica com quem termina o TLS — este Nginx só fala HTTP.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
