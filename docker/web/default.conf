server {
    listen 80 default_server;
    listen [::]:80 default_server ipv6only=on;
    server_name _;
    root /srv/site;
    index index.html;

    server_tokens off;

    absolute_redirect off;

    location ~ /\. {
        return 404;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /og/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(api|admin|auth|livewire(-[0-9a-f]+)?)(/|$) {
        root /var/www/public;
        client_max_body_size 21m;
        try_files $uri /index.php$is_args$args;
    }

    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ ^/(css|js)/filament(/|$) {
        root /var/www/public;
        try_files $uri =404;
    }

    location ~ \.php$ {
        root /var/www/public;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
        client_max_body_size 21m;
        include fastcgi_params;
    }

    location ~ ^/(pt|en)(/.*)?/(index\.html)?$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        return 301 /$1$2$is_args$args;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        return 301 /$is_args$args;
    }

    location ~ ^/(pt/publicacoes|en/publications)(/|$) {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/index.html @app;
    }

    location @app {
        error_page 502 503 504 =404 /404.html;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        include fastcgi_params;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml application/rss+xml text/xml;
}
