server {
    listen 80 default_server;
    listen [::]:80 default_server ipv6only=on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nomes com hash: cache eterno.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rotas de artigo: servem o arquivo pré-renderizado (Fase 6).
    # $uri/index.html e nunca $uri/ — este último devolve 301 acrescentando
    # barra final e briga com o canonical.
    # Quando o Laravel subir, trocar o fallback por @app: o frontend não muda.
    location ~ ^/(pt/publicacoes|en/publications)(/|$) {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
        # try_files $uri $uri/index.html @app;
    }

    # location @app {
    #     fastcgi_pass app:9000;
    #     fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
    #     include fastcgi_params;
    # }

    # HTML nunca em cache: página velha aponta para bundle apagado no deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
