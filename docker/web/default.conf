server {
    listen 80 default_server;
    listen [::]:80 default_server ipv6only=on;
    server_name _;
    root /srv/site;
    index index.html;

    # Sem a versão no cabeçalho Server nem na página de erro.
    server_tokens off;

    # Location relativo nos 301: o Nginx montaria o absoluto com a porta em que
    # escuta (80), não a que o leitor usou (8080, ou o 443 do proxy).
    absolute_redirect off;

    # Arquivos ocultos do build (.build-id, .vite/manifest.json) não são
    # página: 404, como qualquer coisa que não seja rota.
    location ~ /\. {
        return 404;
    }

    # Nomes com hash: cache eterno.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # --- Backend: API pública e painel administrativo ----------------------
    #
    # O upstream vai numa variável de propósito. Com `fastcgi_pass app:9000`
    # direto, o Nginx resolve o nome ao carregar a configuração e se recusa a
    # subir quando o perfil `backend` está desligado — que é o caso do dia a dia
    # de quem mexe só no frontend. Na variável, a resolução acontece por
    # requisição, e sem backend o que se perde é /api, não o site.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(api|admin|livewire)(/|$) {
        root /var/www/public;
        # O teto do upload do RDM Studio (docker/php/php.ini). Precisa estar aqui
        # e no bloco do PHP: o limite é checado em cada location por onde a
        # requisição passa, e o padrão de 1 MB recusava antes do try_files.
        client_max_body_size 21m;
        try_files $uri /index.php$is_args$args;
    }

    # Mídia enviada pelo RDM Studio (disco `public` do Laravel). Servida direto
    # do volume, sem `storage:link`: o symlink apontaria para um caminho que só
    # existe no container `app`. Nome por UUID, conteúdo nunca reescrito. O `^~`
    # vence o `location ~ \.php$`: nada daqui chega ao PHP-FPM.
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # O que o Filament publica em backend/public no `filament:install`.
    location ~ ^/(css|js)/filament(/|$) {
        root /var/www/public;
        try_files $uri =404;
    }

    location ~ \.php$ {
        root /var/www/public;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
        client_max_body_size 21m;
        include fastcgi_params;
    }

    # Uma página, um endereço. O try_files abaixo também resolveria /pt/, os
    # artigos com barra final e o index.html explícito com 200 — URLs a mais
    # que o buscador rastreia como cópias. Antes da location dos artigos: entre
    # regex, vence a primeira. A raiz `/` fica: escolhe o idioma pela
    # preferência do leitor, e o canonical dela já aponta para /pt.
    location ~ ^/(pt|en)(/.*)?/(index\.html)?$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        return 301 /$1$2$is_args$args;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        return 301 /$is_args$args;
    }

    # Rotas de artigo: servem o arquivo pré-renderizado.
    # $uri/index.html e nunca $uri/ — este último devolve 301 acrescentando
    # barra final e briga com o canonical.
    #
    # O @app cobre só a janela entre salvar no painel e o job de regeração
    # terminar. Alcançá-lo é exceção: a casca do Laravel sai com noindex e
    # deixa um aviso no log.
    location ~ ^/(pt/publicacoes|en/publications)(/|$) {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/index.html @app;
    }

    location @app {
        # Sem backend no ar não há como saber se o slug existe, e o arquivo não
        # está no disco: a resposta é o 404 que o site estático daria, não um 502.
        error_page 502 503 504 =404 /404.html;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        include fastcgi_params;
    }

    # HTML nunca em cache: página velha aponta para bundle apagado no deploy.
    #
    # Sem fallback para /index.html: o prerender grava um arquivo para cada rota
    # que `src/core/routing.ts` reconhece, então o que não está no disco não é
    # rota. Devolver o index com 200 a qualquer endereço era um soft-404 — o
    # rastreador indexava /pt/publications/{slug}, com o segmento do outro
    # idioma, como uma segunda URL do mesmo artigo.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/index.html =404;
    }

    # O 404 mantém o endereço pedido e o status: é o JavaScript que, ao subir,
    # reconhece a rota inválida e mostra a mesma mensagem dentro da constelação.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
