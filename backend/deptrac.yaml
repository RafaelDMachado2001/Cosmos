deptrac:
  paths:
    - ./app
  layers:
    - name: Platform
      collectors:
        - type: directory
          value: app/(?!Modules/|Providers/).*
    - name: Content
      collectors:
        - type: directory
          value: app/Modules/Content/(?!Contracts/).*
    - name: ContentContract
      collectors:
        - type: directory
          value: app/Modules/Content/Contracts/.*
    - name: Identity
      collectors:
        - type: directory
          value: app/Modules/Identity/(?!Events/|Contracts/).*
    - name: IdentityContract
      collectors:
        - type: directory
          value: app/Modules/Identity/(Events|Contracts)/.*
    - name: Community
      collectors:
        - type: directory
          value: app/Modules/Community/(?!Events/).*
    - name: CommunityContract
      collectors:
        - type: directory
          value: app/Modules/Community/Events/.*
    - name: Activity
      collectors:
        - type: directory
          value: app/Modules/Activity/.*
  ruleset:
    Platform: ~
    Content:
      - Platform
      - ContentContract
    ContentContract: ~
    Identity:
      - Platform
      - IdentityContract
    IdentityContract: ~
    Community:
      - Platform
      - IdentityContract
      - ContentContract
      - CommunityContract
    CommunityContract: ~
    Activity:
      - Platform
      - IdentityContract
      - CommunityContract
