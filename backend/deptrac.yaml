deptrac:
  paths:
    - ./app
  layers:
    - name: Platform
      collectors:
        - type: directory
          value: app/(?!Modules/|Providers/).*
    - name: Content
      collectors:
        - type: directory
          value: app/Modules/Content/.*
    - name: Identity
      collectors:
        - type: directory
          value: app/Modules/Identity/(?!Events/|Contracts/).*
    - name: IdentityContract
      collectors:
        - type: directory
          value: app/Modules/Identity/(Events|Contracts)/.*
    - name: Activity
      collectors:
        - type: directory
          value: app/Modules/Activity/.*
  ruleset:
    Platform: ~
    Content:
      - Platform
    Identity:
      - Platform
      - IdentityContract
    IdentityContract: ~
    Activity:
      - Platform
      - IdentityContract
